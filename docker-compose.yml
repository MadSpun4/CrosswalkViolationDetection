services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:rw
      - ./models:/app/models:rw
      - ./input_data:/app/input_data:ro
      - ./runtime:/app/runtime:rw
    command: ["uvicorn", "src.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
